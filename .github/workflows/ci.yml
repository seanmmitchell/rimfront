name: RimFront CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rimfront-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and exercise the production firing controller
        run: |
          New-Item -ItemType Directory -Force .build/ci | Out-Null
          Start-Transcript -Path .build/ci/portable.log
          try { ./scripts/test-portable.ps1 }
          finally { Stop-Transcript }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
          path: |
            .build/ci/*.log
            .build/firing-loop/**/results.json
            .build/firing-loop/**/scenarios.jsonl
            .build/firing-loop/**/build.log
            .build/terrain-regressions/**/results.json
            .build/terrain-regressions/**/test.log
            .build/terrain-regressions/**/build.log
      - name: Retain main's tested 1.6 compile output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rimfront-1.6-compile-only-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: mod/1.6/Assemblies/RimFront.dll

  gate:
    name: RimFront CI gate
    if: always()
    needs: [portable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
        run: |
          test "$PORTABLE_RESULT" = success
